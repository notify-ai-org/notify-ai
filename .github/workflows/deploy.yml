name: Build and Deploy to EC2

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  IMAGE: vocab-agent
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/vocab-agent

jobs:
  # ── Step 1: build the React microfrontend portals ─────────────────────────
  build-ui:
    name: Build UI portals
    uses: ./.github/workflows/build-ui.yml
    secrets: inherit

  # ── Step 2: build the Docker image and deploy to EC2 ──────────────────────
  build-and-deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest
    needs: build-ui   # wait for portal assets before building the Docker image
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.CHECKOUT_PAT || github.token }}

      # Download the portal builds produced by the build-ui job.
      # They land in the Spring Boot classpath so the JAR includes them.
      - name: Download portal assets
        uses: actions/download-artifact@v4
        with:
          name: portal-assets
          path: access/src/main/resources/static/portals/
        continue-on-error: true   # no portals exist yet during early development

      # Authenticate to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Set up QEMU for multi-platform builds (ARM -> AMD64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Set up Docker Buildx for multi-platform support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push the image to GHCR
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate deploy secrets
        env:
          CHECKOUT_PAT: ${{ secrets.CHECKOUT_PAT }}
        run: |
          if [ -z "$CHECKOUT_PAT" ]; then
            echo "ERROR: CHECKOUT_PAT is not set. Add a GitHub token with repo and read:packages so checkout and EC2 image pulls can authenticate."
            exit 1
          fi

      - name: Prepare EC2 deploy directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            sudo mkdir -p /opt/vocab-agent
            sudo chown -R "${USER}:${USER}" /opt/vocab-agent

      - name: Copy Compose deployment files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,deploy"
          target: "/opt/vocab-agent"

      # Deploy to EC2 via SSH
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            # Log in to GHCR on the EC2 instance
            printf '%s' '${{ secrets.CHECKOUT_PAT }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

            # Pull the latest image
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

            cd /opt/vocab-agent
            ENV_FILE=/opt/vocab-agent/deploy/ec2.env

            if [ ! -f "$ENV_FILE" ]; then
              echo "ERROR: $ENV_FILE does not exist. Copy deploy/ec2.env.example to deploy/ec2.env and set production secrets."
              exit 1
            fi

            # Required production secrets must come from the Compose env file.
            for required_var in DB_PASSWORD REDIS_PASSWORD OPENAI_API_KEY; do
              if ! grep -Eq "^${required_var}=.+" "$ENV_FILE"; then
                echo "ERROR: $required_var is not set in $ENV_FILE."
                exit 1
              fi
            done

            cat > docker-compose.deploy.yml <<'COMPOSE'
            services:
              vocab-agent:
                image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            COMPOSE

            docker compose --env-file "$ENV_FILE" -f docker-compose.yml -f docker-compose.deploy.yml pull vocab-agent
            docker compose --env-file "$ENV_FILE" -f docker-compose.yml -f docker-compose.deploy.yml up -d

            # Wait a moment to check if it crashed immediately
            sleep 3
            if ! docker ps --filter name=${{ env.IMAGE }} --format "{{.Names}}" | grep -q "^${{ env.IMAGE }}$"; then
              echo "ERROR: Container failed to start or crashed on startup!"
              docker logs ${{ env.IMAGE }}
              exit 1
            fi

            # Prune old images to free disk space
            docker image prune -af --filter "until=24h"

      # Verify the deployment
      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "── Container status ──"
            docker ps -a --filter name=${{ env.IMAGE }} --format "table {{.ID}}\t{{.Status}}\t{{.Ports}}"

            echo ""
            echo "── Health check ──"
            ENV_FILE=/opt/vocab-agent/deploy/ec2.env
            if [ -f "$ENV_FILE" ]; then
              SERVER_PORT="$(grep -E '^SERVER_PORT=' "$ENV_FILE" | tail -1 | cut -d= -f2-)"
            fi
            MANAGEMENT_PORT=${SERVER_PORT:-8080}
            # Wait up to 60s for the app to start responding
            for i in $(seq 1 12); do
              if curl -sf http://localhost:${MANAGEMENT_PORT}/actuator/health > /dev/null 2>&1; then
                echo "✓ Application is healthy"
                exit 0
              fi
              echo "  Waiting for app to start... (attempt $i/12)"
              sleep 5
            done
            echo "✗ Application did not become healthy in time"
            docker logs --tail 50 ${{ env.IMAGE }}
            exit 1

name: Build and Deploy to EC2

on:
  push:
    branches:
      - master

env:
  IMAGE: vocab-agent
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/vocab-agent

jobs:
  # ── Step 1: build the React microfrontend portals ─────────────────────────
  build-ui:
    name: Build UI portals
    uses: ./.github/workflows/build-ui.yml
    secrets: inherit

  # ── Step 2: build the Docker image and deploy to EC2 ──────────────────────
  build-and-deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest
    needs: build-ui   # wait for portal assets before building the Docker image
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.GHCR_PAT }}

      # Download the portal builds produced by the build-ui job.
      # They land in the Spring Boot classpath so the JAR includes them.
      - name: Download portal assets
        uses: actions/download-artifact@v4
        with:
          name: portal-assets
          path: access/src/main/resources/static/portals/
        continue-on-error: true   # no portals exist yet during early development

      # Authenticate to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Set up QEMU for multi-platform builds (ARM -> AMD64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Set up Docker Buildx for multi-platform support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push the image to GHCR
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploy to EC2 via SSH
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Log in to GHCR on the EC2 instance
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull the latest image
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

            # Stop and remove existing container (if running)
            docker stop ${{ env.IMAGE }} 2>/dev/null || true
            docker rm ${{ env.IMAGE }} 2>/dev/null || true

            # Run the new container
            docker run -d \
              --name ${{ env.IMAGE }} \
              --restart unless-stopped \
              -p 8080:8080 \
              --env-file /opt/vocab-agent/.env \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

            # Prune old images to free disk space
            docker image prune -af --filter "until=24h"

      # Verify the deployment
      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "── Container status ──"
            docker ps --filter name=${{ env.IMAGE }} --format "table {{.ID}}\t{{.Status}}\t{{.Ports}}"

            echo ""
            echo "── Health check ──"
            # Wait up to 60s for the app to start responding
            for i in $(seq 1 12); do
              if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
                echo "✓ Application is healthy"
                exit 0
              fi
              echo "  Waiting for app to start... (attempt $i/12)"
              sleep 5
            done
            echo "✗ Application did not become healthy in time"
            docker logs --tail 50 ${{ env.IMAGE }}
            exit 1

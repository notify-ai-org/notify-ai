services:
  localstack:
    image: localstack/localstack:4.7.0
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: secretsmanager,kms,sts
      AWS_DEFAULT_REGION: us-east-1
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_DB: notify_test
      POSTGRES_USER: notify_test
      POSTGRES_PASSWORD: notify-test-only

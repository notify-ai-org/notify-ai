proxy_cache_path /var/cache/nginx/portal-assets
    levels=1:2
    keys_zone=portal_assets:32m
    max_size=512m
    inactive=30d
    use_temp_path=off;

upstream notify_access {
    server vocab-agent:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name app.notify-ai.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name app.notify-ai.dev;

    ssl_certificate /etc/letsencrypt/live/app.notify-ai.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.notify-ai.dev/privkey.pem;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location ~ ^/portals/[^/]+/assets/.+\.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        proxy_cache portal_assets;
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        proxy_ignore_headers Set-Cookie;
        proxy_hide_header Set-Cookie;
        proxy_set_header Origin "";
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Portal-Asset-Cache $upstream_cache_status always;
        proxy_pass http://notify_access;
    }

    location ~ ^/portals/[^/]+/?$ {
        add_header Cache-Control "no-store" always;
        proxy_pass http://notify_access;
    }

    location / {
        proxy_pass http://notify_access;
    }
}

server.port=8090

# Notify SDK configuration
notify.ai.properties.base-package=com.example.ecommerce
notify.ai.properties.acp-server-url=http://localhost:8080
notify.ai.properties.application-name=ecommerce-app
notify.ai.properties.client-id=notify-ai-test-key-001

# Disable Kafka (not needed for testing)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration

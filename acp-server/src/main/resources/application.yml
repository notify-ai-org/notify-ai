spring:
  kafka:
    consumer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
      group-id: vocab-adk-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.records: 50

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vocabdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

vocab:
  kafka-topic: ${VOCAB_TOPIC:vocabulary-raw}
  openai-model: ${OPENAI_MODEL:gpt-4o-mini}
  openai-max-tokens: 160
  description-max-length: 512

acp:
  auth:
    jwt:
      secret: ${ACP_JWT_SECRET:changeme-at-least-32-characters-long-secret-key}
      required-scope: ${ACP_JWT_REQUIRED_SCOPE:agent:invoke}
    skip-paths: /api/client/register,/api/auth/token/refresh,/actuator/health,/actuator/info

#      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
#      properties:
#        max.poll.records: 50

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vocabdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        show_sql: false
        format_sql: false
  quartz:
    properties:
      org.quartz.threadPool.threadCount: 2

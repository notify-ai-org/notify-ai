      api-key: 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
    anthropic:
      api-key: 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

redis:
  host: ${REDIS_HOST:redis-19139.crce263.ap-south-1-1.ec2.cloud.redislabs.com}
  port: ${REDIS_PORT:19139}
  username: ${REDIS_USERNAME:test}
  password: ${REDIS_PASSWORD:Msdian-77}

vocab:
  kafka-topic: ${VOCAB_TOPIC:vocabulary-raw}
  openai-model: ${OPENAI_MODEL:gpt-4o-mini}
  openai-max-tokens: 160
  description-max-length: 512

agent:
  orchestrator:
    core-pool-size: ${AGENT_CORE_POOL_SIZE:10}         # agents permanently kept alive
    max-pool-size: ${AGENT_MAX_POOL_SIZE:20}           # burst ceiling
    idle-timeout-seconds: ${AGENT_IDLE_TIMEOUT:300}    # 5 min idle → evict overflow agent
    cleanup-interval-seconds: ${AGENT_CLEANUP_INTERVAL:60}

openai:
  api:
    base-url: ${OPENAI_API_BASE_URL:https://api.openai.com/v1}
    key: ${OPENAI_API_KEY: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}
    timeout: ${OPENAI_API_TIMEOUT:30s}
    connection-timeout: ${OPENAI_API_CONNECTION_TIMEOUT:10s}

embedding:
  max-batch-size: ${EMBEDDING_MAX_BATCH_SIZE:10}
  max-wait: ${EMBEDDING_MAX_WAIT:100ms}
  schema-version: ${EMBEDDING_SCHEMA_VERSION:v1}

#  auth:
#    jwt:
#      secret: ${ACP_JWT_SECRET:changeme-at-least-32-characters-long-secret-key}
#      required-scope: ${ACP_JWT_REQUIRED_SCOPE:agent:invoke}
#    skip-paths: /api/client/register,/api/auth/token/refresh,/actuator/health,/actuator/info

executors:
  cpu:
    core: 4
    max: 8
    queue: 1000

  io:
    core: 8
    max: 64
    queue: 5000

  llm:
    core: 2
    max: 4
    queue: 200

  dispatcher:
    core: 4
    max: 20
    queue: 1000

  scheduler:
    threads: 2

logging:
  level:
    com.example.agent: 'DEBUG'
    org.hibernate.SQL: 'OFF'
    org.hibernate.orm.jdbc.bind: 'OFF'

notification:
  smtp:
    from: ${SMTP_FROM:noreply@example.com}
    fromName: ${SMTP_FROM_NAME:Vocab Agent}
    defaultHtml: true

connector:
  channel:
    WEBHOOK:
      clazz: "com.example.agent.connectors.WebhookConnector"
      instances: 1
    EMAIL:
      clazz: "com.example.agent.connectors.SmtpEmailConnector"
      instances: 1

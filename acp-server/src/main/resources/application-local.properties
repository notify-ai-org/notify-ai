# Local Development Configuration
# All values here are defaults suitable for running locally (docker-compose or native)

# ─── Database ────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/agent?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

# ─── Redis ───────────────────────────────────────────────────────────────────
redis.host=localhost
redis.port=6379
redis.username=default
redis.password=

# ─── Redis Vector ────────────────────────────────────────────────────────────
redis.vector.dim=3072

# ─── Kafka ───────────────────────────────────────────────────────────────────
# spring.kafka.consumer.bootstrap-servers=localhost:9092
# spring.kafka.consumer.group-id=vocab-adk-group

# ─── OpenAI ──────────────────────────────────────────────────────────────────
openai.api.base-url=https://api.openai.com/v1
openai.api.key=sk-proj-REPLACE_WITH_YOUR_LOCAL_KEY
openai.api.timeout=30s
openai.api.connection-timeout=10s
spring.ai.openai.api-key=sk-proj-REPLACE_WITH_YOUR_LOCAL_KEY
spring.ai.anthropic.api-key=sk-ant-REPLACE_WITH_YOUR_LOCAL_KEY

# ─── Vocab ───────────────────────────────────────────────────────────────────
vocab.kafka-topic=vocabulary-raw
vocab.openai-model=gpt-4o-mini
vocab.openai-max-tokens=160
vocab.description-max-length=512

# ─── Embedding ───────────────────────────────────────────────────────────────
embedding.max-batch-size=10
embedding.max-wait=100ms
embedding.schema-version=v1
embedding.cache-ttl=24h

# ─── Agent Memory ────────────────────────────────────────────────────────────
agent.memory.window-size=1h
agent.memory.inactivity-timeout=30m
agent.memory.max-facts=50

# ─── Agent Buffer ────────────────────────────────────────────────────────────
agent.buffer.timeout=15s

# ─── Auth (JWT) ──────────────────────────────────────────────────────────────
acp.auth.jwt.secret=local-dev-secret-at-least-32-characters-long
acp.auth.jwt.required-scope=agent:invoke
acp.auth.skip-paths=/api/client/register,/api/auth/token/refresh,/actuator/health,/actuator/info

# ─── Spring Profile ──────────────────────────────────────────────────────────
spring.profiles.active=local

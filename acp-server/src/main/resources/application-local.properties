# Local Development Configuration
# All values here are defaults suitable for running locally (docker-compose or native)

# ─── Database ────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/agent?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

# ─── Redis ───────────────────────────────────────────────────────────────────
redis.host=localhost
redis.port=6379
redis.username=default
redis.password=Msdian-77

# ─── Redis Vector ────────────────────────────────────────────────────────────
redis.vector.dim=3072

# ─── Kafka ───────────────────────────────────────────────────────────────────
# spring.kafka.consumer.bootstrap-servers=localhost:9092
# spring.kafka.consumer.group-id=vocab-adk-group

# ─── OpenAI ──────────────────────────────────────────────────────────────────
openai.api.base-url=https://api.openai.com/v1
openai.api.key=sk-proj-REPLACE_WITH_YOUR_LOCAL_KEY
openai.api.timeout=30s
openai.api.connection-timeout=10s
spring.ai.openai.api-key=sk-proj-REPLACE_WITH_YOUR_LOCAL_KEY
spring.ai.anthropic.api-key=sk-ant-REPLACE_WITH_YOUR_LOCAL_KEY

# ─── Vocab ───────────────────────────────────────────────────────────────────
vocab.kafka-topic=vocabulary-raw
vocab.openai-model=gpt-4o-mini
vocab.openai-max-tokens=160
vocab.description-max-length=512

# ─── Embedding ───────────────────────────────────────────────────────────────
embedding.max-batch-size=10
embedding.max-wait=100ms
embedding.schema-version=v1
embedding.cache-ttl=24h

# ─── Agent Memory ────────────────────────────────────────────────────────────
agent.memory.window-size=1h
agent.memory.inactivity-timeout=30m
agent.memory.max-facts=50

# ─── Agent Buffer ────────────────────────────────────────────────────────────
agent.buffer.timeout=15s

# ─── Auth (JWT) ──────────────────────────────────────────────────────────────
acp.auth.jwt.secret=local-dev-secret-at-least-32-characters-long
acp.auth.jwt.required-scope=agent:invoke
acp.auth.skip-paths=/api/client/register,/api/auth/token/refresh,/actuator/health,/actuator/info

# ─── Foundations ─────────────────────────────────────────────────────────────
spring.main.allow-bean-definition-overriding=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
spring.quartz.properties.org.quartz.threadPool.threadCount=2

# ─── Executors ───────────────────────────────────────────────────────────────
executors.cpu.core=4
executors.cpu.max=8
executors.cpu.queue=1000
executors.io.core=8
executors.io.max=64
executors.io.queue=5000
executors.llm.core=2
executors.llm.max=4
executors.llm.queue=200
executors.dispatcher.core=4
executors.dispatcher.max=20
executors.dispatcher.queue=1000
executors.scheduler.threads=2

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.example.agent=DEBUG
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

# ─── Agent ───────────────────────────────────────────────────────────────────
agent.orchestrator.core-pool-size=10
agent.orchestrator.max-pool-size=20
agent.orchestrator.idle-timeout-seconds=300
agent.orchestrator.cleanup-interval-seconds=60

# ─── Connectors ──────────────────────────────────────────────────────────────
connector.channel.WEBHOOK.clazz=com.example.agent.connectors.WebhookConnector
connector.channel.WEBHOOK.instances=1
connector.channel.EMAIL.clazz=com.example.agent.connectors.SmtpEmailConnector
connector.channel.EMAIL.instances=1

# ─── Notifications ───────────────────────────────────────────────────────────
notification.smtp.from=noreply@example.com
notification.smtp.fromName=Vocab Agent
notification.smtp.defaultHtml=true

# Dev (GKE) Environment Configuration
# All values are sourced from Kubernetes ConfigMap / Secret environment variables

# ─── Database ────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

# ─── Redis ───────────────────────────────────────────────────────────────────
redis.host=${REDIS_HOST}
redis.port=${REDIS_PORT}
redis.username=${REDIS_USERNAME}
redis.password=${REDIS_PASSWORD}

# ─── Redis Vector ────────────────────────────────────────────────────────────
redis.vector.dim=${REDIS_VECTOR_DIM}

# ─── Kafka ───────────────────────────────────────────────────────────────────
# spring.kafka.consumer.bootstrap-servers=${KAFKA_BOOTSTRAP}
# spring.kafka.consumer.group-id=${KAFKA_GROUP_ID}

# ─── OpenAI ──────────────────────────────────────────────────────────────────
openai.api.base-url=${OPENAI_API_BASE_URL}
openai.api.key=${OPENAI_API_KEY}
openai.api.timeout=${OPENAI_API_TIMEOUT}
openai.api.connection-timeout=${OPENAI_API_CONNECTION_TIMEOUT}
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}

# ─── Vocab ───────────────────────────────────────────────────────────────────
vocab.kafka-topic=${VOCAB_TOPIC}
vocab.openai-model=${OPENAI_MODEL}
vocab.openai-max-tokens=${VOCAB_OPENAI_MAX_TOKENS}
vocab.description-max-length=${VOCAB_DESCRIPTION_MAX_LENGTH}

# ─── Embedding ───────────────────────────────────────────────────────────────
embedding.max-batch-size=${EMBEDDING_MAX_BATCH_SIZE}
embedding.max-wait=${EMBEDDING_MAX_WAIT}
embedding.schema-version=${EMBEDDING_SCHEMA_VERSION}
embedding.cache-ttl=${EMBEDDING_CACHE_TTL}

# ─── Agent Memory ────────────────────────────────────────────────────────────
agent.memory.window-size=${AGENT_MEMORY_WINDOW_SIZE}
agent.memory.inactivity-timeout=${AGENT_MEMORY_INACTIVITY_TIMEOUT}
agent.memory.max-facts=${AGENT_MEMORY_MAX_FACTS}

# ─── Agent Buffer ────────────────────────────────────────────────────────────
agent.buffer.timeout=${AGENT_BUFFER_TIMEOUT}

# ─── Auth (JWT) ──────────────────────────────────────────────────────────────
acp.auth.jwt.secret=${ACP_JWT_SECRET}
acp.auth.jwt.required-scope=${ACP_JWT_REQUIRED_SCOPE}
acp.auth.skip-paths=${ACP_AUTH_SKIP_PATHS}

# ─── Foundations ─────────────────────────────────────────────────────────────
spring.main.allow-bean-definition-overriding=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
spring.quartz.properties.org.quartz.threadPool.threadCount=2

# ─── Executors ───────────────────────────────────────────────────────────────
executors.cpu.core=4
executors.cpu.max=8
executors.cpu.queue=1000
executors.io.core=8
executors.io.max=64
executors.io.queue=5000
executors.llm.core=2
executors.llm.max=4
executors.llm.queue=200
executors.dispatcher.core=4
executors.dispatcher.max=20
executors.dispatcher.queue=1000
executors.scheduler.threads=2

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.example.agent=DEBUG
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

# ─── Agent ───────────────────────────────────────────────────────────────────
agent.orchestrator.core-pool-size=${AGENT_CORE_POOL_SIZE:10}
agent.orchestrator.max-pool-size=${AGENT_MAX_POOL_SIZE:20}
agent.orchestrator.idle-timeout-seconds=${AGENT_IDLE_TIMEOUT:300}
agent.orchestrator.cleanup-interval-seconds=${AGENT_CLEANUP_INTERVAL:60}

# ─── Connectors ──────────────────────────────────────────────────────────────
connector.channel.WEBHOOK.clazz=com.example.agent.connectors.WebhookConnector
connector.channel.WEBHOOK.instances=1
connector.channel.EMAIL.clazz=com.example.agent.connectors.SmtpEmailConnector
connector.channel.EMAIL.instances=1

# ─── Notifications ───────────────────────────────────────────────────────────
notification.smtp.from=${SMTP_FROM:noreply@example.com}
notification.smtp.fromName=${SMTP_FROM_NAME:Vocab Agent}
notification.smtp.defaultHtml=true

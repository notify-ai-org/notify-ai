spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
#  kafka:
#    consumer:
#      bootstrap-servers: ${KAFKA_BOOTSTRAP}
#      group-id: vocab-adk-group
#      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
#      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
#      properties:
#        max.poll.records: 50

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver


  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
  quartz:
    properties:
      org.quartz.threadPool.threadCount: 2

vocab:
  kafka-topic: ${VOCAB_TOPIC}
  openai-model: ${OPENAI_MODEL}
  openai-max-tokens: 160
  description-max-length: 512

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}
  username: ${REDIS_USERNAME}
  password: ${REDIS_PASSWORD}
  database: 0
  timeout: 2000        # ms - connect timeout
  lettuce:
    shutdown-timeout: 100     # ms
    pool:
      max-active: 32
      max-idle: 16
      min-idle: 4
      max-wait: 2000          # ms

logging:
  level:
    root: INFO

connector:
  channel:
    WEBHOOK:
      clazz: "com.example.agent.connectors.WebhookConnector"
      instances: 1
    EMAIL:
      clazz: "com.example.agent.connectors.SmtpEmailConnector"
      instances: 1
